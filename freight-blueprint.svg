<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="drawingTitle drawingDescription">
<title id="drawingTitle">Freight transport technical illustration</title>
<desc id="drawingDescription">Steel-blue vector engineering study of a conventional long-hood sleeper semi tractor towing a dry van trailer, with correctly spaced steering, drive and trailer axles.</desc>
<defs>
<style>
.outline{fill:none;stroke:#476D91;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.structure{fill:none;stroke:#476D91;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.detail{fill:none;stroke:#476D91;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;opacity:.70}
.ghost{fill:none;stroke:#476D91;stroke-width:.75;stroke-linecap:round;opacity:.36}
.shell{fill:#102940;stroke:#476D91;stroke-width:2.6;stroke-linejoin:round}
.glass{fill:#102237;stroke:#476D91;stroke-width:2}
.dim{fill:none;stroke:#476D91;stroke-width:1.1;opacity:.76}
.word{font:11px Arial,Helvetica,sans-serif;fill:#476D91;letter-spacing:2.7px}
.micro{font:9px Arial,Helvetica,sans-serif;fill:#476D91;letter-spacing:2px;opacity:.85}
</style>
<pattern id="tread" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#476D91" stroke-width=".7" opacity=".4"/></pattern>
</defs>
