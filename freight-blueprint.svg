<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" role="img" aria-labelledby="tt dd">
<title id="tt">Class 8 tractor and 53-foot van trailer — technical blueprint</title>
<desc id="dd">Original, hand-authored three-quarter view of a freight truck with dimension guides and engineering linework.</desc>
<defs>
<pattern id="minor" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#476D91" stroke-opacity=".13" stroke-width=".8"/></pattern>
