<linearGradient id="trailer" x1="0" x2="1" y1="0" y2=".1"><stop offset="0" stop-color="#193c59" stop-opacity=".66"/><stop offset="1" stop-color="#091e31" stop-opacity=".45"/></linearGradient>
<linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#294a63" stop-opacity=".73"/><stop offset="1" stop-color="#0a1d32" stop-opacity=".86"/></linearGradient>
<clipPath id="trailerclip"><path d="M598 200L1103 257L1103 425L598 385Z"/></clipPath>
<style>
.s{stroke:#476D91;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.line{fill:none;stroke:#476D91;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#6b92ac;stroke-width:1.25;stroke-opacity:.66;stroke-linecap:round}.glow{fill:none;stroke:#91cbd1;stroke-width:1.5;stroke-opacity:.55}.shade{fill:#0c2237}.metal{fill:url(#cab)}.micro{font:600 12px system-ui, sans-serif;letter-spacing:3px;fill:#91cbd1;opacity:.8}.guides{fill:none;stroke:#476D91;stroke-width:1.4;stroke-opacity:.66}.wheel{fill:#091b2d;stroke:#628bab;stroke-width:4}.rim{fill:#17344c;stroke:#476d91;stroke-width:2}.hub{fill:#264660;stroke:#91cbd1;stroke-opacity:.56;stroke-width:1.5}
</style>
</defs>
